name: Test Emscripten Installation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-emsdk:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      run: |
        git clone https://github.com/kazakiriGTT/keshi.git .
        git checkout main
      
    - name: Install Emscripten
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
        source ./emsdk_env.sh
        emcc --version
        
    - name: Test simple compilation
      run: |
        source emsdk/emsdk_env.sh
        emcc keshipin_simple.c -I . -o test.html -s USE_GLFW=3 -DPLATFORM_WEB